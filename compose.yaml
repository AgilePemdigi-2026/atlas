# Production stack for Coolify.
# Local development: Compose auto-loads compose.override.yaml.
services:
  generator:
    build:
      context: ./generator-service
    environment:
      KENARI_API_KEY: ${KENARI_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://kenari.id/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-6-luna}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      MAX_RETRIES: ${MAX_RETRIES:-3}
    expose:
      - "8001"
    init: true
    restart: unless-stopped
    mem_limit: 1g
    shm_size: 256mb
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./web
    environment:
      APP_NAME: ATLAS
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/app/database.sqlite
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      GENERATOR_SERVICE_URL: http://generator:8001
      GENERATOR_SERVICE_KEY: ${SERVICE_API_KEY}
      GENERATOR_SERVICE_TIMEOUT: "180"
    expose:
      - "8000"
    volumes:
      - atlas-storage:/app/storage
    init: true
    restart: unless-stopped
    depends_on:
      generator:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        mkdir -p storage/app &&
        touch storage/app/database.sqlite &&
        php artisan optimize:clear &&
        php artisan migrate --force &&
        php artisan optimize &&
        exec php artisan serve --host=0.0.0.0 --port=8000
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  atlas-storage:
