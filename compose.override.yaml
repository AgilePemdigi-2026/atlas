services:
  generator:
    environment:
      KENARI_API_KEY:
      SERVICE_API_KEY:
      LLM_BASE_URL:
      LLM_MODEL:
      LLM_TIMEOUT:
      MAX_RETRIES:
    ports:
      - "127.0.0.1:18001:8001"
    volumes:
      - ./generator-service:/app

  web:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY:
      APP_URL:
      GENERATOR_SERVICE_KEY:
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      DB_URL:
      SESSION_SECURE_COOKIE: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./web/app:/app/app
      - ./web/routes:/app/routes
      - ./web/resources:/app/resources
      - ./web/config:/app/config
      - ./web/database:/app/database
      - ./web/storage:/app/storage
      - ./web/tests:/app/tests
      - ./web/.env:/app/.env:ro
    command:
      - sh
      - -c
      - >-
        touch database/database.sqlite &&
        php artisan migrate --force &&
        php artisan serve --host=0.0.0.0 --port=8000
