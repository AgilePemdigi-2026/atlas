[project]
name = "generator-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.146.0",
    "jinja2>=3.1",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "ruff>=0.17.0",
    "selenium>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testgen"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["tests"]

[tool.uv]
default-groups = ["test"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["tests/fixtures/golden"]
